name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[all]"
      - name: Lint
        run: ruff check .
      - name: Tests
        # Tests train on offline stand-in data and use a scripted fake Ollama, so no network or GPU is needed.
        run: pytest -q
        env:
          MLFLOW_DISABLE_TELEMETRY: "true"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mlhub:ci .
      - name: Smoke test: train offline, then start the API and probe /health
        run: |
          docker run --rm -e MLHUB_OFFLINE=1 -e MLHUB_MLFLOW=0 -v mlhub-ci:/data mlhub:ci \
            python -m mlhub.training.train_all
          docker run -d --name api -p 8000:8000 -v mlhub-ci:/data mlhub:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | tee /dev/stderr | grep -q '"status":"degraded"\|"status":"ok"'
          curl -sf -X POST localhost:8000/v1/predict/iris -H 'content-type: application/json' \
            -d '{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}' | grep -q setosa
